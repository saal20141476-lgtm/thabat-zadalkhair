name: Build Thabat APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unzip Project Archive
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -type f -name '*.zip' -print -quit)
          if [ -z "$ZIP_FILE" ]; then
            echo "Project ZIP archive not found in repository root."
            exit 1
          fi
          unzip -o "$ZIP_FILE" -d project_src
          ROOT_DIR=$(find project_src -mindepth 1 -maxdepth 1 -type d | head -n 1)
          if [ -n "$ROOT_DIR" ] && [ -f "$ROOT_DIR/settings.gradle" ]; then
            echo "PROJECT_DIR=$ROOT_DIR" >> "$GITHUB_ENV"
          elif [ -f project_src/settings.gradle ]; then
            echo "PROJECT_DIR=project_src" >> "$GITHUB_ENV"
          else
            echo "Gradle project root not found in ZIP."
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build installable Debug APK (no user secrets required)
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle assembleDebug --no-daemon

      - name: Prepare APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          APK=$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' | head -n 1)
          test -n "$APK"
          mkdir -p release_output
          cp "$APK" release_output/Thabat-ZadAlKhair-Debug.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Thabat-ZadAlKhair-Debug-APK
          path: ${{ env.PROJECT_DIR }}/release_output/Thabat-ZadAlKhair-Debug.apk
          if-no-files-found: error

      - name: Publish APK Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="debug-v1.0.${{ github.run_number }}"
          gh release create "$TAG" "${{ env.PROJECT_DIR }}/release_output/Thabat-ZadAlKhair-Debug.apk" \
            --title "ثبات | زاد الخير - نسخة تجريبية ($TAG)" \
            --notes "نسخة Android تجريبية موقعة تلقائياً بمفتاح Debug. لا تحتاج إلى أسرار توقيع. هذه ليست نسخة إنتاج نهائية.";
